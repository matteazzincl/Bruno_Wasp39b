transit:
  t0: 0.0 # time of inferior conjunction
  per: 4.0552941 # orbital period in days
  rp: 0.13973482428115 # planet radius (in units of stellar radii)
  a: 11.0560685836 # semi-major axis (in units of stellar radii)
  inc: 87.32 # orbital inclination (in degrees)
  ecc: 0.0 # eccentricity
  w: 90.0 # longitude of periastron (in degrees)
  u: [0.099, 0.13] # limb darkening coefficients [u1, u2]
  limb_dark: "quadratic" # limb darkening model
classifier:
  type: cnn # [cnn, rf] for Convolutional Neural Network and Random Forest
